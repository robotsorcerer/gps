[pytest]
testpaths = python/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom marks — every test must carry exactly one of these
markers =
    unit: Fast, isolated unit tests (no I/O, no GPU, no ROS)
    integration: Multi-component tests that may do I/O
    load: Parametrized throughput / scalability tests
    soak: Long-running stability tests (run nightly, not in CI gate)
    fault: Fault-injection / adversarial-input tests
    gpu: Tests that require a CUDA-capable GPU
    ros: Tests that require a live ROS master

# Default: run unit + integration + fault; exclude slow/hw-dependent marks
addopts = -v --tb=short -m "not soak and not gpu and not ros"

# Fail the suite if any warning is an error (catches DeprecationWarning etc.)
filterwarnings =
    error::DeprecationWarning
    error::PendingDeprecationWarning
    # Allow third-party deprecations we cannot control yet
    ignore::DeprecationWarning:tensorflow.*
    ignore::DeprecationWarning:pkg_resources.*
