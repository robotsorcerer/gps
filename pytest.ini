[pytest]
# Pytest configuration for GPS (Guided Policy Search)

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths =
    python/gps/tests
    python/gps/tests/integration
    python/gps/tests/system

# Minimum Python version
minversion = 6.0

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    -ra

# Coverage options (when using pytest-cov)
# addopts = --cov=python/gps --cov-report=html --cov-report=term-missing

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interaction
    system: System tests for end-to-end workflows
    slow: Tests that take significant time to run
    load: Load tests for high-volume scenarios
    soak: Soak tests for long-running stability
    stress: Stress tests for extreme conditions
    requires_ros: Tests that require ROS environment
    requires_mujoco: Tests that require MuJoCo installation

# Ignore patterns
norecursedirs = .git build dist *.egg deprecated

# Timeout for tests (seconds)
timeout = 300
