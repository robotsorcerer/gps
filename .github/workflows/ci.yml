name: CI

on:
  push:
    branches: ["iDG", "main", "master"]
  pull_request:
    branches: ["iDG", "main", "master"]

# Cancel in-flight runs for the same ref (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# -------------------------------------------------------------------------
# Global defaults
# -------------------------------------------------------------------------
defaults:
  run:
    shell: bash

jobs:
  # =========================================================================
  # 1. Python unit + integration + fault tests
  # =========================================================================
  python-tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile proto files
        # grpcio-tools ships a protoc binary compatible with protobuf 4.x.
        # The system protoc on ubuntu-22.04 is 3.12 and is too old.
        run: |
          python -m grpc_tools.protoc \
            -I gps_agent_pkg/proto \
            --python_out=python/gps/proto \
            gps_agent_pkg/proto/gps.proto
          touch python/gps/proto/__init__.py

      - name: Run tests (unit + integration + fault)
        run: |
          pytest python/tests \
            -m "not soak and not gpu and not ros and not load" \
            --timeout=120 \
            --cov=python/gps \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # =========================================================================
  # 2. Load tests (parametrized scalability — separate job, longer timeout)
  # =========================================================================
  load-tests:
    name: Load tests
    runs-on: ubuntu-22.04
    needs: python-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile proto files
        run: |
          python -m grpc_tools.protoc \
            -I gps_agent_pkg/proto \
            --python_out=python/gps/proto \
            gps_agent_pkg/proto/gps.proto
          touch python/gps/proto/__init__.py

      - name: Run load tests
        run: |
          pytest python/tests \
            -m "load" \
            --timeout=300 \
            -v

  # =========================================================================
  # 3. GPU memory-growth test (self-hosted runner with CUDA required)
  #    Validates that act() does not accumulate device tensors across 1000
  #    inference calls.  Must pass before enabling use_gpu: 1 in production.
  # =========================================================================
  gpu-tests:
    name: GPU memory test
    # Self-hosted runner with an NVIDIA GPU and nvidia-docker.
    # Replace with your GPU runner label.  Skipped on public runners.
    runs-on: [self-hosted, gpu]
    if: ${{ vars.ENABLE_GPU_TESTS == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (CUDA wheel)
        run: |
          pip install -r requirements-dev.txt
          pip install torch==2.1.2+cu121 \
            --index-url https://download.pytorch.org/whl/cu121

      - name: Compile proto files
        run: |
          python -m grpc_tools.protoc \
            -I gps_agent_pkg/proto \
            --python_out=python/gps/proto \
            gps_agent_pkg/proto/gps.proto
          touch python/gps/proto/__init__.py

      - name: Run GPU tests
        run: |
          pytest python/tests \
            -m "gpu" \
            --timeout=120 \
            -v

  # =========================================================================
  # 4. Linting (ruff + mypy)
  # =========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lint tools
        run: pip install ruff mypy

      - name: ruff check
        run: ruff check python/gps --select=E,F,W,I --ignore=E501

      - name: mypy (strict mode, critical modules only)
        run: |
          mypy python/gps/algorithm/cost/ \
               python/gps/algorithm/dynamics/ \
               python/gps/algorithm/traj_opt/ \
               --ignore-missing-imports \
               --no-strict-optional \
               || true   # non-blocking until mypy baseline is clean

  # =========================================================================
  # 5. C++ build + unit tests — ROS 2 Humble (official ros:humble image)
  #    Uses the canonical ROS 2 Docker image with colcon build system.
  #    C++20 standard is required for concepts, ranges, and other modern features.
  #    CPU LibTorch is installed via pip; TORCH_ROOT locates the cmake config.
  # =========================================================================
  cpp-build:
    name: C++20 / ROS 2 Humble build + tests
    runs-on: ubuntu-22.04
    container:
      image: ros:humble

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3-pip \
            libprotobuf-dev protobuf-compiler \
            libeigen3-dev \
            libgtest-dev \
            libboost-system-dev \
            ros-humble-rclcpp \
            ros-humble-sensor-msgs \
            ros-humble-geometry-msgs \
            ros-humble-std-msgs \
            ros-humble-tf2-ros \
            ros-humble-rosidl-default-generators

      - name: Install CPU LibTorch
        run: pip3 install --upgrade pip && pip3 install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build colcon workspace
        run: |
          . /opt/ros/humble/setup.sh
          export TORCH_ROOT=$(python3 -c "import torch, os; print(os.path.dirname(torch.__file__))")
          export ROS_VERSION=2
          mkdir -p /ros_ws/src
          cp -r $GITHUB_WORKSPACE/gps_agent_pkg /ros_ws/src/
          cd /ros_ws
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Run C++ unit tests
        run: |
          . /opt/ros/humble/setup.sh
          export TORCH_ROOT=$(python3 -c "import torch, os; print(os.path.dirname(torch.__file__))")
          export ROS_VERSION=2
          cd /ros_ws
          colcon test
          colcon test-result --verbose

  # =========================================================================
  # 6. ThreadSanitizer (TSan) — standalone test build, no ROS / LibTorch
  #    Only the three unit tests under gps_agent_pkg/test/ are compiled.
  #    LibTorch is intentionally excluded: it is incompatible with TSan.
  # =========================================================================
  tsan:
    name: ThreadSanitizer (C++ data-race detection)
    runs-on: ubuntu-22.04
    needs: cpp-build

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential \
            clang-15 \
            libeigen3-dev \
            libgtest-dev

      - name: Build standalone tests with TSan
        run: |
          mkdir -p /tmp/tsan_build
          cd /tmp/tsan_build
          cmake $GITHUB_WORKSPACE/gps_agent_pkg/test \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
            -DCMAKE_C_COMPILER=clang-15 \
            -DCMAKE_CXX_COMPILER=clang++-15
          make -j$(nproc)

      - name: Run tests under TSan
        run: |
          cd /tmp/tsan_build
          ctest -V

  # =========================================================================
  # 7. Soak test (nightly only — NOT on every push)
  # =========================================================================
  soak-nightly:
    name: Soak test (nightly)
    runs-on: ubuntu-22.04
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run soak tests (8-hour budget)
        run: |
          pytest python/tests \
            -m "soak" \
            --timeout=28800 \
            -v

# -------------------------------------------------------------------------
# Nightly schedule trigger
# -------------------------------------------------------------------------
# Uncomment to enable nightly soak runs:
# on:
#   schedule:
#     - cron: "0 2 * * *"   # 02:00 UTC every night
